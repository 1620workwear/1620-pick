<!DOCTYPE html>

<title>1620 Pick</title>
<style>
:root{
  --bg:#F7F5F0;--surface:#FFFFFF;--border:#DDD9D0;--border2:#C8C4BB;
  --accent:#1C3A2B;--accent2:#2D5A40;
  --green:#15803D;--green-light:#DCFCE7;--green-border:#86EFAC;
  --red:#DC2626;--amber:#FEF3C7;--amber-border:#FCD34D;
  --text:#1A1A1A;--text2:#6B6760;--text3:#9D9892;
  --mono:'Courier New',Courier,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);}

/* SCREEN SYSTEM — no position:fixed anywhere */
.screen{
  display:none;
  flex-direction:column;
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  overflow:hidden;
  background:var(--bg);
}
.screen.active{display:flex;}

/* TOPBAR */
.topbar{
  background:var(--accent);padding:0 16px;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.topbar-logo{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.9);text-transform:uppercase;}
.topbar-logo em{color:rgba(255,255,255,.4);font-style:normal;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-stat{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.55);text-align:right;line-height:1.5;}
.topbar-stat strong{color:#fff;font-size:12px;}
.topbar-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:7px 13px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer}
.topbar-btn:active{background:rgba(255,255,255,.25);}

/* DIAGNOSTICS PANEL */
.diagnostics{
  background:#111827;color:#e6eef2;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.06);width:340px;max-width:40vw;box-shadow:0 6px 22px rgba(0,0,0,.25);
  font-family:var(--mono);font-size:12px;display:none;flex-direction:column;gap:8px;position:absolute;right:12px;top:64px;z-index:60;
}
.diagnostics.show{display:flex;}
.diag-row{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#cfe6d6}
.diag-log{background:#0b1220;color:#cfe6d6;padding:8px;border-radius:8px;height:160px;overflow:auto;border:1px solid rgba(255,255,255,.04);font-size:11px}
.diag-controls{display:flex;gap:8px}

/* rest of styles unchanged... */
/* ... (omitting duplicate CSS for brevity in this snippet) */
</style>
</head>

</div>

// New: logging buffer & diagnostics
var DIAG_LOGS = [];
function addLog(level, msg) {
  try {
    var t = new Date().toISOString();
    var line = t + ' | ' + level + ' | ' + msg;
    DIAG_LOGS.push(line);
    if (DIAG_LOGS.length > 2000) DIAG_LOGS.shift();
    var el = document.getElementById('diag-log'); if (el) { el.textContent = DIAG_LOGS.slice(-200).join('\n'); el.scrollTop = el.scrollHeight; }
    console.log('[DIAG]', line);
  } catch (e) { /* ignore */ }
}
function downloadLogs() {
  var blob = new Blob([DIAG_LOGS.join('\n')], {type:'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = '1620-pick-logs-' + Date.now() + '.txt'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function clearLogs() { DIAG_LOGS = []; var el = document.getElementById('diag-log'); if (el) el.textContent = ''; addLog('INFO','Logs cleared'); }

// Small UI helpers
function setDiagState(s) { var el = document.getElementById('diag-state'); if (el) el.textContent = s; var ps = document.getElementById('printer-status'); if (ps) ps.textContent = 'Printer: ' + s; }
function toggleDiagnostics() { var d = document.getElementById('diagnostics'); if (!d) return; d.classList.toggle('show'); }

// ── Printer reliability configuration (tune these per-device) ┇
window.PRINTER_CHUNK_SIZE = 180; // smaller chunk to respect MTU
window.PRINTER_CHUNK_DELAY = 60; // ms delay between chunks
window.PRINTER_MAX_RETRIES = 2; // attempt reconnect+retry this many times
window.SIMPLE_LABEL_MODE = false; // toggle for debug
// ─────────────────────────────────────────────────────────────────────────

// ── SAFE STORAGE (works on GitHub Pages; degrades silently in previews) ──
function storeSave() {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({ orders: orders, colMap: colMap, sessionStart: sessionStart, savedAt: Date.now() })); }
  catch (e) { addLog('WARN','storeSave failed: ' + e.message); }
}
function storeLoad() {
  try { var raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { addLog('WARN','storeLoad failed'); return null; }
}
function storeClear() { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} }
