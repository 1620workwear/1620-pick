<style>
:root{
  --bg:#F7F5F0;--surface:#FFFFFF;--border:#DDD9D0;--border2:#C8C4BB;
  --accent:#1C3A2B;--accent2:#2D5A40;
  --green:#15803D;--green-light:#DCFCE7;--green-border:#86EFAC;
  --red:#DC2626;--amber:#FEF3C7;--amber-border:#FCD34D;
  --text:#1A1A1A;--text2:#6B6760;--text3:#9D9892;
  --mono:'Courier New',Courier,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);}

/* SCREEN SYSTEM — no position:fixed anywhere */
.screen{
  display:none;
  flex-direction:column;
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  overflow:hidden;
  background:var(--bg);
}
.screen.active{display:flex;}

/* TOPBAR */
.topbar{
  background:var(--accent);padding:0 16px;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.topbar-logo{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.9);text-transform:uppercase;}
.topbar-logo em{color:rgba(255,255,255,.4);font-style:normal;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-stat{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.55);text-align:right;line-height:1.5;}
.topbar-stat strong{color:#fff;font-size:12px;}
.topbar-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:7px 13px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer}
.topbar-btn:active{background:rgba(255,255,255,.25);}

/* DIAGNOSTICS PANEL */
.diagnostics{
  background:#111827;color:#e6eef2;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.06);width:340px;max-width:40vw;box-shadow:0 6px 22px rgba(0,0,0,.25);
  font-family:var(--mono);font-size:12px;display:none;flex-direction:column;gap:8px;position:absolute;right:12px;top:64px;z-index:60;
}
.diagnostics.show{display:flex;}
.diag-row{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#cfe6d6}
.diag-log{background:#0b1220;color:#cfe6d6;padding:8px;border-radius:8px;height:160px;overflow:auto;border:1px solid rgba(255,255,255,.04);font-size:11px}
.diag-controls{display:flex;gap:8px}

<script>
/* ═══════════════════════════════════════════════════════════════
   1620 PICK SYSTEM — v2 (QA rewrite) + diagnostics and reliability fixes
   New additions in this branch:
   - Diagnostics logging and UI
   - Scanner input normalization and paste handling
   - Configurable printer chunk size/delay and improved write logging
   - Simple label toggle to reduce payload for debug
   ═══════════════════════════════════════════════════════════════ */

'use strict';

// ── STATE ──
var APP_VERSION = 'v2.3-reliability';
var orders = [], colMap = {}, rawRows = [], csvHeaders = [];
var currentId = null, currentFilter = 'all', sessionStart = null;
var reprintMode = false;
var SESSION_KEY = '1620pick_session_v3';

// New: logging buffer & diagnostics
var DIAG_LOGS = [];
function addLog(level, msg) {
  try {
    var t = new Date().toISOString();
    var line = t + ' | ' + level + ' | ' + msg;
    DIAG_LOGS.push(line);
    if (DIAG_LOGS.length > 2000) DIAG_LOGS.shift();
    var el = document.getElementById('diag-log'); if (el) { el.textContent = DIAG_LOGS.slice(-200).join('\n'); el.scrollTop = el.scrollHeight; }
    console.log('[DIAG]', line);
  } catch (e) { /* ignore */ }
}
function downloadLogs() {
  var blob = new Blob([DIAG_LOGS.join('\n')], {type:'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = '1620-pick-logs-' + Date.now() + '.txt'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function clearLogs() { DIAG_LOGS = []; var el = document.getElementById('diag-log'); if (el) el.textContent = ''; addLog('INFO','Logs cleared'); }

// Small UI helpers
function setDiagState(s) { var el = document.getElementById('diag-state'); if (el) el.textContent = s; var ps = document.getElementById('printer-status'); if (ps) ps.textContent = 'Printer: ' + s; }
function toggleDiagnostics() { var d = document.getElementById('diagnostics'); if (!d) return; d.classList.toggle('show'); }

// ── Printer reliability configuration (tune these per-device) ┇
window.PRINTER_CHUNK_SIZE = 180; // smaller chunk to respect MTU
window.PRINTER_CHUNK_DELAY = 60; // ms delay between chunks
window.PRINTER_MAX_RETRIES = 2; // attempt reconnect+retry this many times
window.SIMPLE_LABEL_MODE = false; // toggle for debug
// ─────────────────────────────────────────────────────────────────────────

// ── SAFE STORAGE (works on GitHub Pages; degrades silently in previews) ──
function storeSave() {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({ orders: orders, colMap: colMap, sessionStart: sessionStart, savedAt: Date.now() })); }
  catch (e) { addLog('WARN','storeSave failed: ' + e.message); }
}
function storeLoad() {
  try { var raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { addLog('WARN','storeLoad failed'); return null; }
}
function storeClear() { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} }

// ── ESCAPING ──
function escHTML(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escZPL(s) { return String(s == null ? '' : s).replace(/[\u0000-\u001F"]/g, ' ').replace(/[\^~\\]/g,' ').trim(); }

// ── CSV (unchanged parser) ──
function parseCSV(text) {
  text = text.replace(/^\u0000FEFF/,''); // BOM guard
  text = text.replace(/^\uFEFF/, '');
  text = text.replace(/^\uFEFF/, '');
  text = text.replace(/[\r\f]+\u0000?/g, '\r');
  text = text.replace(/\r\n|\r|\n/g, '\n');
  // fallback to previous parser for correctness
  text = text.replace(/^\uFEFF/, '');
  var rows = [], row = [], cur = '', inQ = false, i = 0;
  while (i < text.length) {
    var c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { cur += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      cur += c; i++; continue;
    }
    if (c === '"') { inQ = true; i++; continue; }
    if (c === ',') { row.push(cur.trim()); cur = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(cur.trim()); cur = ''; if (row.some(function(v){return v!=='';})) rows.push(row); row = []; i++; continue; }
    cur += c; i++;
  }
  row.push(cur.trim()); if (row.some(function(v){return v!=='';})) rows.push(row);
  if (rows.length < 2) return { headers: [], rows: [] };
  var headers = rows[0];
  var data = rows.slice(1).map(function(vals) { var obj = {}; headers.forEach(function(h, j) { obj[h] = (vals[j] || '').trim(); }); return obj; });
  return { headers: headers, rows: data };
}

document.getElementById('csv-file-input').addEventListener('change', function(e) { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var parsed = parseCSV(e.target.result);
    if (!parsed.rows.length) { toast('No data rows found in file'); addLog('ERROR','CSV parse returned no rows'); return; }
    csvHeaders = parsed.headers; rawRows = parsed.rows;
    document.getElementById('preview-name').textContent = file.name;
    document.getElementById('preview-count').textContent = parsed.rows.length + ' line items';
    document.getElementById('preview-cols').textContent = 'Cols: ' + parsed.headers.join(' · ');
    document.getElementById('upload-preview').classList.add('visible');
    buildColMap(parsed.headers);
    checkReady();
    addLog('INFO','Loaded CSV ' + file.name + ' with ' + parsed.rows.length + ' rows');
  };
  reader.onerror = function() { toast('Could not read file'); addLog('ERROR','Could not read file'); };
  reader.readAsText(file);
}

// ── COLUMN MAPPING (unchanged) ──
var ALIASES = {
  'map-order':      ['order_number','order_no','ordernumber','order','name','#order','order name','order name'],
  'map-style-name': ['product_name','style_name','product name','style name','product','item','title'],
  'map-style-num':  ['sku','style_number','style_no','style number','style#','pv.sku','pv.sku'],
  'map-color':      ['variant_name','variant name','color','colour','option1'],
  'map-waist':      ['variant_name','variant name','waist','size','option2'],
  'map-inseam':     ['inseam','hem','inseam_length','hem_length','option3','property value'],
  'map-barcode':    ['barcode','upc','barcode_number'],
  'map-customer':   ['customer_name','customer','ship_to','shipping_name','recipient','billing_name','full name','full_name'],
  'map-order-date': ['order_date','date','order date','created_at','created at','ordered_at','o.created at','o.created at','o.createdat'],
  'map-pant-qty':    ['pant_quantity','pant_qty','line_qty','line_quantity','item_qty','ol.quantity','ol.quantity'],
  'map-total-qty':   ['count','total_quantity','total_qty','order_quantity','quantity','qty','order total quantity']
};

function norm(s) { return String(s||'').toLowerCase().replace(/[^a-z0-9]/g, ''); }

function buildColMap(headers) {
  Object.keys(ALIASES).forEach(function(id) {
    var sel = document.getElementById(id); if (!sel) return;
    var optional = ['map-barcode','map-customer','map-order-date','map-quantity'].indexOf(id) >= 0;
    sel.innerHTML = optional ? '<option value="">-- none --</option>' : '<option value="">-- select --</option>';
    headers.forEach(function(h) { var opt = document.createElement('option'); opt.value = h; opt.textContent = h; sel.appendChild(opt); });
    var aliases = ALIASES[id];
    var match = headers.find(function(h) { return aliases.some(function(a) { return norm(h) === norm(a); }); });
    if (!match) match = headers.find(function(h) { return aliases.some(function(a) { return norm(h).indexOf(norm(a)) >= 0; }); });
    if (match) sel.value = match;
  });
  document.getElementById('col-map').style.display = 'flex';
}

function checkReady() {
  var req = ['map-order','map-style-name','map-style-num','map-color','map-waist','map-inseam'];
  var ok = rawRows.length > 0 && req.every(function(id) { var el = document.getElementById(id); return el && el.value; });
  document.getElementById('btn-start').disabled = !ok;
}

function resolveColorWaist(row) {
  var cc = colMap.color, wc = colMap.waist;
  var cv = row[cc] || '', wv = row[wc] || '';
  if (cc === wc && cv.indexOf(' / ') >= 0) {
    var parts = cv.split(' / ').map(function(p){ return p.trim(); });
    var wi = -1;
    for (var i = 0; i < parts.length; i++) { if (/^\d{1,2}$/.test(parts[i])) { wi = i; break; } }
    if (wi > 0) { wv = parts[wi]; cv = parts.slice(0, wi).join(' / '); }
    else { wv = parts[parts.length-1]; cv = parts.slice(0, -1).join(' / '); }
  }
  return { color: cv || '-', waist: wv || '-' };
}

// ── SESSION ──
function startSession() {
  colMap = {
    order:     document.getElementById('map-order').value,
    styleName: document.getElementById('map-style-name').value,
    styleNum:  document.getElementById('map-style-num').value,
    color:     document.getElementById('map-color').value,
    waist:     document.getElementById('map-waist').value,
    inseam:    document.getElementById('map-inseam').value,
    barcode:   document.getElementById('map-barcode').value,
    customer:  document.getElementById('map-customer').value,
    orderDate: document.getElementById('map-order-date').value,
    pantQty:   document.getElementById('map-pant-qty').value,
    totalQty:  document.getElementById('map-total-qty').value
  };
  var orderCol = colMap.order;
  var rowsPerOrder = {};
  rawRows.forEach(function(r) { var k = r[orderCol] || ''; rowsPerOrder[k] = (rowsPerOrder[k] || 0) + 1; });
  orders = rawRows.map(function(row, i) {
    var cw = resolveColorWaist(row);
    var ordNum = row[colMap.order] || ('ORD-' + (i + 1));
    return {
      id: i,
      order:     ordNum,
      styleName: row[colMap.styleName] || '-',
      styleNum:  row[colMap.styleNum] || '-',
      color:     cw.color,
      waist:     cw.waist,
      inseam:    row[colMap.inseam] || '-',
      barcode:   colMap.barcode ? (row[colMap.barcode] || '') : '',
      customer:  colMap.customer ? (row[colMap.customer] || '') : '',
      orderDate: colMap.orderDate ? (row[colMap.orderDate] || '') : '',
      pantQty:   colMap.pantQty ? (row[colMap.pantQty] || '1') : '1',
      totalQty:  colMap.totalQty ? (row[colMap.totalQty] || String(rowsPerOrder[ordNum] || 1)) : String(rowsPerOrder[ordNum] || 1),
      status:    'pending',
      lastPrint: null
    };
  }).sort(function(a, b) { if (a.styleName !== b.styleName) return a.styleName.localeCompare(b.styleName); if (a.color !== b.color) return a.color.localeCompare(b.color); return (parseInt(a.waist, 10) || 0) - (parseInt(b.waist, 10) || 0); });
  sessionStart = Date.now(); storeSave();
  document.getElementById('sidebar-date').textContent = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  renderQueue(); updateProgress(); updateTopbar(); showScreen('screen-queue');
  addLog('INFO','Session started with ' + orders.length + ' orders');
}

// restore session unchanged
function tryRestoreSession() { var saved = storeLoad(); if (!saved || !saved.orders || !saved.orders.length) return; var picked = saved.orders.filter(function(o) { return o.status === 'picked'; }[...]

// ── QUEUE ──
function renderQueue() { var list = document.getElementById('queue-list'); var search = document.getElementById('search-input').value.toLowerCase(); var filtered = orders.filter(function(o) { if [...]
