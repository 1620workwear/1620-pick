<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1620 Pick</title>
<style>
:root{
  --bg:#F7F5F0;--surface:#FFFFFF;--border:#DDD9D0;--border2:#C8C4BB;
  --accent:#1C3A2B;--accent2:#2D5A40;
  --green:#15803D;--green-light:#DCFCE7;--green-border:#86EFAC;
  --red:#DC2626;--amber:#FEF3C7;--amber-border:#FCD34D;
  --text:#1A1A1A;--text2:#6B6760;--text3:#9D9892;
  --mono:'Courier New',Courier,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);}

/* SCREEN SYSTEM — no position:fixed anywhere */
.screen{
  display:none;
  flex-direction:column;
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  overflow:hidden;
  background:var(--bg);
}
.screen.active{display:flex;}

/* TOPBAR */
.topbar{
  background:var(--accent);padding:0 16px;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.topbar-logo{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.9);text-transform:uppercase;}
.topbar-logo em{color:rgba(255,255,255,.4);font-style:normal;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-stat{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.55);text-align:right;line-height:1.5;}
.topbar-stat strong{color:#fff;font-size:12px;}
.topbar-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:7px 13px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer}
.topbar-btn:active{background:rgba(255,255,255,.25);}

/* ── SCREEN 1: UPLOAD ── */
#screen-upload{overflow-y:auto;}
.upload-scroll{display:flex;flex-direction:column;align-items:center;padding:28px 18px 48px;gap:22px;min-height:100%;}
.upload-title{font-size:26px;font-weight:700;color:var(--accent);text-align:center;line-height:1.2;}
.upload-card{background:var(--surface);border-radius:16px;padding:22px 18px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:16px;box-shadow:0 2px 16px rgba(0,0,0,.08);}
.upload-zone{border:2px dashed var(--border2);border-radius:12px;padding:32px 16px;text-align:center;cursor:pointer;position:relative;background:var(--bg);}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.upload-zone-icon{font-size:38px;margin-bottom:8px;}
.upload-zone-label{font-size:16px;font-weight:600;margin-bottom:4px;}
.upload-zone-sub{font-size:12px;color:var(--text3);line-height:1.7;}
.upload-preview{background:var(--green-light);border:1px solid var(--green-border);border-radius:10px;padding:12px 14px;display:none;}
.upload-preview.visible{display:block;}
.upload-preview-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.upload-preview-name{font-weight:600;color:var(--green);font-size:13px;}
.upload-preview-count{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--green);}
.upload-preview-cols{font-family:var(--mono);font-size:10px;color:#166534;}
.col-map{display:flex;flex-direction:column;gap:8px;}
.col-map-title{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;}
.col-map-row{display:flex;align-items:center;gap:8px;}
.col-map-field{font-size:13px;font-weight:600;color:var(--text);width:80px;flex-shrink:0;}
.col-map-field span{color:var(--red);}
select.col-select{flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-family:var(--sans);font-size:14px;color:var(--text);}
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:18px;font-family:var(--sans);font-size:17px;font-weight:700;cursor:pointer;width:100%;}
.btn-primary:active{background:var(--accent2);}
.btn-primary:disabled{background:var(--border);color:var(--text3);cursor:not-allowed;}

/* ── SCREEN 2: QUEUE ── */
.queue-subheader{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;flex-shrink:0;}
.progress-bar-wrap{background:var(--bg);border-radius:100px;height:5px;overflow:hidden;margin-bottom:5px;}
.progress-bar-fill{background:var(--green);height:100%;border-radius:100px;transition:width .4s;}
.progress-label{font-family:var(--mono);font-size:11px;color:var(--text2);}
.progress-label strong{color:var(--text);}
.filter-tabs{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);}
.filter-tab{flex:1;padding:8px 4px;border:1.5px solid var(--border);border-radius:8px;background:transparent;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer}
.filter-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.search-wrap{padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);}
.search-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:10px 13px;font-family:var(--sans);font-size:14px;color:var(--text);}
.search-input:focus{outline:none;border-color:var(--accent);}
.queue-list{flex:1;overflow-y:auto;padding:8px 12px;-webkit-overflow-scrolling:touch;}
.queue-item{
  border-radius:10px;padding:14px 14px;margin-bottom:6px;
  cursor:pointer;border:1.5px solid transparent;
  background:var(--surface);
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.queue-item:active{background:rgba(28,58,43,.06);border-color:var(--accent);}
.queue-item.picked{background:var(--green-light);border-color:var(--green-border);cursor:pointer;}
.queue-item.picked:active{background:#c9f3d6;}
.queue-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.queue-item-order{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text);}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.status-dot.pending{background:var(--border2);}
.status-dot.picked{background:var(--green);}
.queue-item-style{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.queue-item-details{font-family:var(--mono);font-size:11px;color:var(--text2);}
.queue-empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;}

/* ── SCREEN 3: PICK DETAIL ── */
.pick-nav{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.back-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:9px 15px;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;}
.back-btn:active{background:var(--border);}
.pick-nav-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;}
.pick-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.pick-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px;}
.pick-order-num{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);margin-bottom:2px;}
.pick-style-name{font-size:20px;font-weight:700;color:var(--text);}
.pick-specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-bottom:1px solid var(--border);}
.pick-spec{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;}
.spec-label{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;}
.spec-value{font-size:22px;font-weight:700;color:var(--text);line-height:1;}
.spec-value.big{font-size:54px;color:var(--accent);}
.spec-sub{font-family:var(--mono);font-size:10px;color:var(--text3);}
.pick-location{background:var(--amber);border-bottom:1px solid var(--amber-border);padding:12px 18px;display:flex;align-items:center;gap:10px;}
.pick-location-text{font-family:var(--mono);font-size:13px;color:#92400E;}
.pick-location-text strong{font-size:14px;color:#78350F;}
.pick-actions{padding:18px 14px;display:flex;flex-direction:column;gap:12px;align-items:center;}
.scan-box{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:18px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.scan-hint{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;text-align:center;margin-bottom:12px;}
.scan-input{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:16px 14px;font-family:var(--mono);font-size:22px;font-weight:700;color:var(--text);text-align:center;}
.scan-input:focus{outline:none;border-color:var(--accent);}
.scan-input.error{border-color:var(--red);}
.scan-error{font-size:13px;color:var(--red);font-weight:600;min-height:18px;text-align:center;margin-bottom:8px;}
.or-div{text-align:center;font-family:var(--mono);font-size:11px;color:var(--text3);margin:4px 0 12px;}
.btn-confirm{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:20px;font-family:var(--sans);font-size:19px;font-weight:700;cursor:pointer;width:100%;}
.btn-confirm:active{background:var(--accent2);}
.btn-skip{background:transparent;color:var(--text2);border:1.5px solid var(--border);border-radius:10px;padding:14px;font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;width:100%;}
.btn-skip:active{background:var(--border);} 

/* ── SCREEN 4: CONFIRM/PRINT ── */
#screen-confirm{overflow-y:auto;}
.confirm-scroll{display:flex;flex-direction:column;align-items:center;padding:28px 18px 48px;gap:18px;}
.confirm-title{font-size:22px;font-weight:700;color:var(--text);}
.confirm-sub{font-size:14px;color:var(--text2);text-align:center;margin-top:-10px;}
.label-preview{width:100%;max-width:360px;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:20px 22px;font-family:var(--mono);display:flex;flex-direction:column;gap:6px;}
.lbl-order{font-size:11px;color:var(--text3);} 
.lbl-style{font-size:17px;font-weight:700;color:var(--text);} 
.lbl-meta{font-size:12px;color:var(--text2);} 
.lbl-inseam{font-size:38px;font-weight:900;color:var(--accent);margin-top:4px;} 
.confirm-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px;} 
.btn-print{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:20px;font-family:var(--sans);font-size:18px;font-weight:700;cursor:pointer;width:100%;} 
.btn-print:active{background:var(--accent2);} 
.btn-back{background:var(--bg);color:var(--text2);border:1.5px solid var(--border);border-radius:10px;padding:14px;font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;width:100%;}

/* ── SCREEN 5: DONE ── */
#screen-done{overflow-y:auto;align-items:center;justify-content:center;}
.done-inner{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:48px 28px;}
.done-icon{font-size:72px;} 
.done-title{font-size:34px;font-weight:700;color:var(--accent);} 
.done-sub{font-size:16px;color:var(--text2);max-width:300px;} 
.done-stats{display:flex;gap:24px;background:var(--surface);border-radius:14px;padding:20px 28px;box-shadow:0 2px 12px rgba(0,0,0,.07);} 
.done-stat-val{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--accent);} 
.done-stat-label{font-size:12px;color:var(--text2);margin-top:2px;} 
.btn-outline{background:transparent;color:var(--accent);border:2px solid var(--accent);border-radius:12px;padding:15px 34px;font-family:var(--sans);font-size:16px;font-weight:700;cursor:pointer;} 
.btn-outline:active{background:var(--accent);color:#fff;} 

/* TOAST — only thing using fixed, and it's decorative only so OK if it doesn't show on content:// */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:100px;font-size:14px;font-weight:600;opacity:0;transition:all .18s;z-index:120}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);} 
</style>
</head>

<!-- Diagnostics panel -->
<div class="diagnostics" id="diagnostics">
  <div class="diag-row"><div><strong>Diagnostics</strong></div><div id="diag-printer-name">—</div></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   1620 PICK SYSTEM — v2 (QA rewrite) + diagnostics and reliability fixes
   New additions in this branch:
   - Diagnostics logging and UI
   - Scanner input normalization and paste handling
   - Configurable printer chunk size/delay and improved write logging
   - Simple label toggle to reduce payload for debug
   ═══════════════════════════════════════════════════════════════ */

'use strict';

// ── STATE ──
var APP_VERSION = 'v2.3-reliability (published 2026-09-01T16:30:00Z)';
var orders = [], colMap = {}, rawRows = [], csvHeaders = [];
var currentId = null, currentFilter = 'all', sessionStart = null;
var reprintMode = false;
var SESSION_KEY = '1620pick_session_v3';

// New: logging buffer & diagnostics
var DIAG_LOGS = [];
function addLog(level, msg) {
  try {
    var t = new Date().toISOString();
    var line = t + ' | ' + level + ' | ' + msg;
    DIAG_LOGS.push(line);
    if (DIAG_LOGS.length > 2000) DIAG_LOGS.shift();
    var el = document.getElementById('diag-log'); if (el) { el.textContent = DIAG_LOGS.slice(-200).join('\n'); el.scrollTop = el.scrollHeight; }
    console.log('[DIAG]', line);
  } catch (e) { /* ignore */ }
}
function downloadLogs() {
  var blob = new Blob([DIAG_LOGS.join('\n')], {type:'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = '1620-pick-logs-' + Date.now() + '.txt'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function clearLogs() { DIAG_LOGS = []; var el = document.getElementById('diag-log'); if (el) el.textContent = ''; addLog('INFO','Logs cleared'); }

// Small UI helpers
function setDiagState(s) { var el = document.getElementById('diag-state'); if (el) el.textContent = s; var ps = document.getElementById('printer-status'); if (ps) ps.textContent = 'Printer: ' + s; }
function toggleDiagnostics() { var d = document.getElementById('diagnostics'); if (!d) return; d.classList.toggle('show'); }

// ── Printer reliability configuration (tune these per-device) ┇
window.PRINTER_CHUNK_SIZE = 180; // smaller chunk to respect MTU
window.PRINTER_CHUNK_DELAY = 60; // ms delay between chunks
window.PRINTER_MAX_RETRIES = 2; // attempt reconnect+retry this many times
window.SIMPLE_LABEL_MODE = false; // toggle for debug
// ─────────────────────────────────────────────────────────────────────────

// ── SAFE STORAGE (works on GitHub Pages; degrades silently in previews) ──
function storeSave() {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({ orders: orders, colMap: colMap, sessionStart: sessionStart, savedAt: Date.now() })); }
  catch (e) { addLog('WARN','storeSave failed: ' + e.message); }
}
function storeLoad() {
  try { var raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { addLog('WARN','storeLoad failed'); return null; }
}
function storeClear() { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} }

// ── ESCAPING ──
function escHTML(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escZPL(s) { return String(s == null ? '' : s).replace(/[\u0000-\u001F"]/g, ' ').replace(/[\^~\\]/g,' ').trim(); }

// ── CSV (unchanged parser) ──
function parseCSV(text) {
  text = text.replace(/^\u0000FEFF/,''); // BOM guard
  text = text.replace(/^\uFEFF/, '');
  text = text.replace(/^\uFEFF/, '');
  text = text.replace(/[\r\f]+\u0000?/g, '\r');
  text = text.replace(/\r\n|\r|\n/g, '\n');
  // fallback to previous parser for correctness
  text = text.replace(/^\uFEFF/, '');
  var rows = [], row = [], cur = '', inQ = false, i = 0;
  while (i < text.length) {
    var c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { cur += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      cur += c; i++; continue;
    }
    if (c === '"') { inQ = true; i++; continue; }
    if (c === ',') { row.push(cur.trim()); cur = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(cur.trim()); cur = ''; if (row.some(function(v){return v!=='';})) rows.push(row); row = []; i++; continue; }
    cur += c; i++;
  }
  row.push(cur.trim()); if (row.some(function(v){return v!=='';})) rows.push(row);
  if (rows.length < 2) return { headers: [], rows: [] };
  var headers = rows[0];
  var data = rows.slice(1).map(function(vals) { var obj = {}; headers.forEach(function(h, j) { obj[h] = (vals[j] || '').trim(); }); return obj; });
  return { headers: headers, rows: data };
}

document.getElementById('csv-file-input').addEventListener('change', function(e) { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var parsed = parseCSV(e.target.result);
    if (!parsed.rows.length) { toast('No data rows found in file'); addLog('ERROR','CSV parse returned no rows'); return; }
    csvHeaders = parsed.headers; rawRows = parsed.rows;
    document.getElementById('preview-name').textContent = file.name;
    document.getElementById('preview-count').textContent = parsed.rows.length + ' line items';
    document.getElementById('preview-cols').textContent = 'Cols: ' + parsed.headers.join(' · ');
    document.getElementById('upload-preview').classList.add('visible');
    buildColMap(parsed.headers);
    checkReady();
    addLog('INFO','Loaded CSV ' + file.name + ' with ' + parsed.rows.length + ' rows');
  };
  reader.onerror = function() { toast('Could not read file'); addLog('ERROR','Could not read file'); };
  reader.readAsText(file);
}

  'map-total-qty':   ['count','total_quantity','total_qty','order_quantity','quantity','qty','order total quantity']
};

function norm(s) { return String(s||'').toLowerCase().replace(/[^a-z0-9]/g, ''); }

function buildColMap(headers) {
  Object.keys(ALIASES).forEach(function(id) {
    var sel = document.getElementById(id); if (!sel) return;
    var optional = ['map-barcode','map-customer','map-order-date','map-quantity'].indexOf(id) >= 0;
    sel.innerHTML = optional ? '<option value="">-- none --</option>' : '<option value="">-- select --</option>';
    headers.forEach(function(h) { var opt = document.createElement('option'); opt.value = h; opt.textContent = h; sel.appendChild(opt); });
    var aliases = ALIASES[id];
    var match = headers.find(function(h) { return aliases.some(function(a) { return norm(h) === norm(a); }); });
    if (!match) match = headers.find(function(h) { return aliases.some(function(a) { return norm(h).indexOf(norm(a)) >= 0; }); });
    if (match) sel.value = match;
  });
  document.getElementById('col-map').style.display = 'flex';
}

function checkReady() {
  var req = ['map-order','map-style-name','map-style-num','map-color','map-waist','map-inseam'];
  var ok = rawRows.length > 0 && req.every(function(id) { var el = document.getElementById(id); return el && el.value; });
  document.getElementById('btn-start').disabled = !ok;
}

function resolveColorWaist(row) {
  var cc = colMap.color, wc = colMap.waist;
  var cv = row[cc] || '', wv = row[wc] || '';
  if (cc === wc && cv.indexOf(' / ') >= 0) {
    var parts = cv.split(' / ').map(function(p){ return p.trim(); });
    var wi = -1;
    for (var i = 0; i < parts.length; i++) { if (/^\d{1,2}$/.test(parts[i])) { wi = i; break; } }
    if (wi > 0) { wv = parts[wi]; cv = parts.slice(0, wi).join(' / '); }
    else { wv = parts[parts.length-1]; cv = parts.slice(0, -1).join(' / '); }
  }
  return { color: cv || '-', waist: wv || '-' };
}

function startSession() {
  colMap = {
    order:     document.getElementById('map-order').value,
    styleName: document.getElementById('map-style-name').value,
    styleNum:  document.getElementById('map-style-num').value,
    color:     document.getElementById('map-color').value,
    waist:     document.getElementById('map-waist').value,
    inseam:    document.getElementById('map-inseam').value,
    barcode:   document.getElementById('map-barcode').value,
    customer:  document.getElementById('map-customer').value,
    orderDate: document.getElementById('map-order-date').value,
    pantQty:   document.getElementById('map-pant-qty').value,
    totalQty:  document.getElementById('map-total-qty').value
  };
  var orderCol = colMap.order;
  var rowsPerOrder = {};
  rawRows.forEach(function(r) { var k = r[orderCol] || ''; rowsPerOrder[k] = (rowsPerOrder[k] || 0) + 1; });
  orders = rawRows.map(function(row, i) {
    var cw = resolveColorWaist(row);
    var ordNum = row[colMap.order] || ('ORD-' + (i + 1));
    return {
      id: i,
      order:     ordNum,
      styleName: row[colMap.styleName] || '-',
      styleNum:  row[colMap.styleNum] || '-',
      color:     cw.color,
      waist:     cw.waist,
      inseam:    row[colMap.inseam] || '-',
      barcode:   colMap.barcode ? (row[colMap.barcode] || '') : '',
      customer:  colMap.customer ? (row[colMap.customer] || '') : '',
      orderDate: colMap.orderDate ? (row[colMap.orderDate] || '') : '',
      pantQty:   colMap.pantQty ? (row[colMap.pantQty] || '1') : '1',
      totalQty:  colMap.totalQty ? (row[colMap.totalQty] || String(rowsPerOrder[ordNum] || 1)) : String(rowsPerOrder[ordNum] || 1),
      status:    'pending',
      lastPrint: null
    };
  }).sort(function(a, b) { if (a.styleName !== b.styleName) return a.styleName.localeCompare(b.styleName); if (a.color !== b.color) return a.color.localeCompare(b.color); return (parseInt(a.waist, 10) || 0) - (parseInt(b.waist, 10) || 0); });
  sessionStart = Date.now(); storeSave();
  document.getElementById('sidebar-date').textContent = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  renderQueue(); updateProgress(); updateTopbar(); showScreen('screen-queue');
  addLog('INFO','Session started with ' + orders.length + ' orders');
}
