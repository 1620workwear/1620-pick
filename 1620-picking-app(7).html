<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1620 Pick</title>
<style>
:root{
  --bg:#F7F5F0;--surface:#FFFFFF;--border:#DDD9D0;--border2:#C8C4BB;
  --accent:#1C3A2B;--accent2:#2D5A40;
  --green:#15803D;--green-light:#DCFCE7;--green-border:#86EFAC;
  --red:#DC2626;--amber:#FEF3C7;--amber-border:#FCD34D;
  --text:#1A1A1A;--text2:#6B6760;--text3:#9D9892;
  --mono:'Courier New',Courier,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);}

/* SCREEN SYSTEM — no position:fixed anywhere */
.screen{
  display:none;
  flex-direction:column;
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  overflow:hidden;
  background:var(--bg);
}
.screen.active{display:flex;}

/* TOPBAR */
.topbar{
  background:var(--accent);padding:0 16px;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.topbar-logo{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.9);text-transform:uppercase;}
.topbar-logo em{color:rgba(255,255,255,.4);font-style:normal;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-stat{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.55);text-align:right;line-height:1.5;}
.topbar-stat strong{color:#fff;font-size:12px;}
.topbar-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:7px 13px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer}
.topbar-btn:active{background:rgba(255,255,255,.25);}

/* DIAGNOSTICS PANEL */
.diagnostics{
  background:#111827;color:#e6eef2;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.06);width:340px;max-width:40vw;box-shadow:0 6px 22px rgba(0,0,0,.25);
  font-family:var(--mono);font-size:12px;display:none;flex-direction:column;gap:8px;position:absolute;right:12px;top:64px;z-index:60;
}
.diagnostics.show{display:flex;}
.diag-row{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#cfe6d6}
.diag-log{background:#0b1220;color:#cfe6d6;padding:8px;border-radius:8px;height:160px;overflow:auto;border:1px solid rgba(255,255,255,.04);font-size:11px}
.diag-controls{display:flex;gap:8px}

/* rest of styles unchanged... */
/* ... (omitting duplicate CSS for brevity in this snippet) */
</style>
</head>

<div class="screen active" id="screen-upload">

      <button class="btn-skip" style="max-width:none" onclick="connectPrinter()" id="btn-connect-upload">🖨 Connect Printer</button>

<div class="toast" id="toast"></div>


<script>
/* ═══════════════════════════════════════════════════════════════
   1620 PICK SYSTEM — v2 (QA rewrite) + diagnostics and reliability fixes
   New additions in this branch:
   - Diagnostics logging and UI
   - Scanner input normalization and paste handling
   - Configurable printer chunk size/delay and improved write logging
   - Simple label toggle to reduce payload for debug
   ═══════════════════════════════════════════════════════════════ */

'use strict';

// ── STATE ──
var APP_VERSION = 'v2.3-reliability';
var orders = [], colMap = {}, rawRows = [], csvHeaders = [];
var currentId = null, currentFilter = 'all', sessionStart = null;
var reprintMode = false;
var SESSION_KEY = '1620pick_session_v3';

// New: logging buffer & diagnostics
var DIAG_LOGS = [];
function addLog(level, msg) {
  try {
    var t = new Date().toISOString();
    var line = t + ' | ' + level + ' | ' + msg;
    DIAG_LOGS.push(line);
    if (DIAG_LOGS.length > 2000) DIAG_LOGS.shift();
    var el = document.getElementById('diag-log'); if (el) { el.textContent = DIAG_LOGS.slice(-200).join('\n'); el.scrollTop = el.scrollHeight; }
    console.log('[DIAG]', line);
  } catch (e) { /* ignore */ }
}
function downloadLogs() {
  var blob = new Blob([DIAG_LOGS.join('\n')], {type:'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = '1620-pick-logs-' + Date.now() + '.txt'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function clearLogs() { DIAG_LOGS = []; var el = document.getElementById('diag-log'); if (el) el.textContent = ''; addLog('INFO','Logs cleared'); }

// Small UI helpers
function setDiagState(s) { var el = document.getElementById('diag-state'); if (el) el.textContent = s; var ps = document.getElementById('printer-status'); if (ps) ps.textContent = 'Printer: ' + s; }
function toggleDiagnostics() { var d = document.getElementById('diagnostics'); if (!d) return; d.classList.toggle('show'); }

// ── Printer reliability configuration (tune these per-device) ┇
window.PRINTER_CHUNK_SIZE = 180; // smaller chunk to respect MTU
window.PRINTER_CHUNK_DELAY = 60; // ms delay between chunks
window.PRINTER_MAX_RETRIES = 2; // attempt reconnect+retry this many times
window.SIMPLE_LABEL_MODE = false; // toggle for debug
// ─────────────────────────────────────────────────────────────────────────

// ── SAFE STORAGE (works on GitHub Pages; degrades silently in previews) ──
function storeSave() {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({ orders: orders, colMap: colMap, sessionStart: sessionStart, savedAt: Date.now() })); }
  catch (e) { addLog('WARN','storeSave failed: ' + e.message); }
}
function storeLoad() {
  try { var raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { addLog('WARN','storeLoad failed'); return null; }
}
function storeClear() { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} }

// ── ESCAPING ──
function escHTML(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escZPL(s) { return String(s == null ? '' : s).replace(/[␀-"]/g, ' ').replace(/[\^~\\]/g,' ').trim(); }

// ── CSV (unchanged parser) ──
function parseCSV(text) {
  text = text.replace(/^␀FEFF/,''); // BOM guard
  text = text.replace(/^␀FEFF/, '');
  text = text.replace(/^\uFEFF/, '');
  text = text.replace(/^\uFEFF/, '');
  text = text.replace(/[\r\f]+\u0000?/g, '\r');
  text = text.replace(/\r\n|\r|\n/g, '\n');
  // fallback to previous parser for correctness
  text = text.replace(/^\uFEFF/, '');
  var rows = [], row = [], cur = '', inQ = false, i = 0;
  while (i < text.length) {
    var c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { cur += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      cur += c; i++; continue;
    }
    if (c === '"') { inQ = true; i++; continue; }
    if (c === ',') { row.push(cur.trim()); cur = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(cur.trim()); cur = ''; if (row.some(function(v){return v!=='';})) rows.push(row); row = []; i++; continue; }
    cur += c; i++;
  }
  row.push(cur.trim()); if (row.some(function(v){return v!=='';})) rows.push(row);
  if (rows.length < 2) return { headers: [], rows: [] };
  var headers = rows[0];
  var data = rows.slice(1).map(function(vals) { var obj = {}; headers.forEach(function(h, j) { obj[h] = (vals[j] || '').trim(); }); return obj; });
  return { headers: headers, rows: data };
}

document.getElementById('csv-file-input').addEventListener('change', function(e) { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var parsed = parseCSV(e.target.result);
    if (!parsed.rows.length) { toast('No data rows found in file'); addLog('ERROR','CSV parse returned no rows'); return; }
    csvHeaders = parsed.headers; rawRows = parsed.rows;
    document.getElementById('preview-name').textContent = file.name;
    document.getElementById('preview-count').textContent = parsed.rows.length + ' line items';
    document.getElementById('preview-cols').textContent = 'Cols: ' + parsed.headers.join(' · ');
    document.getElementById('upload-preview').classList.add('visible');
    buildColMap(parsed.headers);
    checkReady();
    addLog('INFO','Loaded CSV ' + file.name + ' with ' + parsed.rows.length + ' rows');
  };
  reader.onerror = function() { toast('Could not read file'); addLog('ERROR','Could not read file'); };
  reader.readAsText(file);
}

// ── COLUMN MAPPING (unchanged) ──
var ALIASES = {
  'map-order':      ['order_number','order_no','ordernumber','order','name','#order','order name','order name'],
  'map-style-name': ['product_name','style_name','product name','style name','product','item','title'],
  'map-style-num':  ['sku','style_number','style_no','style number','style#','pv.sku','pv.sku'],
  'map-color':      ['variant_name','variant name','color','colour','option1'],
  'map-waist':      ['variant_name','variant name','waist','size','option2'],
  'map-inseam':     ['inseam','hem','inseam_length','hem_length','option3','property value'],
  'map-barcode':    ['barcode','upc','barcode_number'],
  'map-customer':   ['customer_name','customer','ship_to','shipping_name','recipient','billing_name','full name','full_name'],
  'map-order-date': ['order_date','date','order date','created_at','created at','ordered_at','o.created at','o.created at','o.createdat'],
  'map-pant-qty':    ['pant_quantity','pant_qty','line_qty','line_quantity','item_qty','ol.quantity','ol.quantity'],
  'map-total-qty':   ['count','total_quantity','total_qty','order_quantity','quantity','qty','order total quantity']
};

function norm(s) { return String(s||'').toLowerCase().replace(/[^a-z0-9]/g, ''); }

function buildColMap(headers) {
  Object.keys(ALIASES).forEach(function(id) {
    var sel = document.getElementById(id); if (!sel) return;
    var optional = ['map-barcode','map-customer','map-order-date','map-quantity'].indexOf(id) >= 0;
    sel.innerHTML = optional ? '<option value="">-- none --</option>' : '<option value="">-- select --</option>';
    headers.forEach(function(h) { var opt = document.createElement('option'); opt.value = h; opt.textContent = h; sel.appendChild(opt); });
    var aliases = ALIASES[id];
    var match = headers.find(function(h) { return aliases.some(function(a) { return norm(h) === norm(a); }); });
    if (!match) match = headers.find(function(h) { return aliases.some(function(a) { return norm(h).indexOf(norm(a)) >= 0; }); });
    if (match) sel.value = match;
  });
  document.getElementById('col-map').style.display = 'flex';
}

function checkReady() {
  var req = ['map-order','map-style-name','map-style-num','map-color','map-waist','map-inseam'];
  var ok = rawRows.length > 0 && req.every(function(id) { var el = document.getElementById(id); return el && el.value; });
  document.getElementById('btn-start').disabled = !ok;
}

function resolveColorWaist(row) {
  var cc = colMap.color, wc = colMap.waist;
  var cv = row[cc] || '', wv = row[wc] || '';
  if (cc === wc && cv.indexOf(' / ') >= 0) {
    var parts = cv.split(' / ').map(function(p){ return p.trim(); });
    var wi = -1;
    for (var i = 0; i < parts.length; i++) { if (/^\d{1,2}$/.test(parts[i])) { wi = i; break; } }
    if (wi > 0) { wv = parts[wi]; cv = parts.slice(0, wi).join(' / '); }
    else { wv = parts[parts.length-1]; cv = parts.slice(0, -1).join(' / '); }
  }
  return { color: cv || '-', waist: wv || '-' };
}

// ── SESSION ──
function startSession() {
  colMap = {
    order:     document.getElementById('map-order').value,
    styleName: document.getElementById('map-style-name').value,
    styleNum:  document.getElementById('map-style-num').value,
    color:     document.getElementById('map-color').value,
    waist:     document.getElementById('map-waist').value,
    inseam:    document.getElementById('map-inseam').value,
    barcode:   document.getElementById('map-barcode').value,
    customer:  document.getElementById('map-customer').value,
    orderDate: document.getElementById('map-order-date').value,
    pantQty:   document.getElementById('map-pant-qty').value,
    totalQty:  document.getElementById('map-total-qty').value
  };
  var orderCol = colMap.order;
  var rowsPerOrder = {};
  rawRows.forEach(function(r) { var k = r[orderCol] || ''; rowsPerOrder[k] = (rowsPerOrder[k] || 0) + 1; });
  orders = rawRows.map(function(row, i) {
    var cw = resolveColorWaist(row);
    var ordNum = row[colMap.order] || ('ORD-' + (i + 1));
    return {
      id: i,
      order:     ordNum,
      styleName: row[colMap.styleName] || '-',
      styleNum:  row[colMap.styleNum] || '-',
      color:     cw.color,
      waist:     cw.waist,
      inseam:    row[colMap.inseam] || '-',
      barcode:   colMap.barcode ? (row[colMap.barcode] || '') : '',
      customer:  colMap.customer ? (row[colMap.customer] || '') : '',
      orderDate: colMap.orderDate ? (row[colMap.orderDate] || '') : '',
      pantQty:   colMap.pantQty ? (row[colMap.pantQty] || '1') : '1',
      totalQty:  colMap.totalQty ? (row[colMap.totalQty] || String(rowsPerOrder[ordNum] || 1)) : String(rowsPerOrder[ordNum] || 1),
      status:    'pending',
      lastPrint: null
    };
  }).sort(function(a, b) { if (a.styleName !== b.styleName) return a.styleName.localeCompare(b.styleName); if (a.color !== b.color) return a.color.localeCompare(b.color); return (parseInt(a.waist, 10) || 0) - (parseInt(b.waist, 10) || 0); });
  sessionStart = Date.now(); storeSave();
  document.getElementById('sidebar-date').textContent = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  renderQueue(); updateProgress(); updateTopbar(); showScreen('screen-queue');
  addLog('INFO','Session started with ' + orders.length + ' orders');
}

// restore session unchanged
function tryRestoreSession() { var saved = storeLoad(); if (!saved || !saved.orders || !saved.orders.length) return; var picked = saved.orders.filter(function(o) { return o.status === 'picked'; }).length; var pending = saved.orders.length - picked; if (pending === 0) { storeClear(); return; } var age = Math.round((Date.now() - (saved.savedAt || 0)) / 3600000); if (age > 20) { storeClear(); return; } if (confirm('Resume previous session? (' + picked + ' picked, ' + pending + ' pending)')) { orders = saved.orders; colMap = saved.colMap || {}; sessionStart = saved.sessionStart || Date.now(); document.getElementById('sidebar-date').textContent = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); renderQueue(); updateProgress(); updateTopbar(); showScreen('screen-queue'); } else { storeClear(); } }

// ── QUEUE ──
function renderQueue() { var list = document.getElementById('queue-list'); var search = document.getElementById('search-input').value.toLowerCase(); var filtered = orders.filter(function(o) { if (currentFilter === 'pending' && o.status !== 'pending') return false; if (currentFilter === 'picked' && o.status !== 'picked') return false; if (search) return o.order.toLowerCase().indexOf(search) >= 0 || o.styleName.toLowerCase().indexOf(search) >= 0 || o.color.toLowerCase().indexOf(search) >= 0; return true; }); if (!filtered.length) { list.innerHTML = '<div class="queue-empty">No orders match</div>'; return; } list.innerHTML = filtered.map(function(o) { var picked = o.status === 'picked'; return '<div class="queue-item' + (picked ? ' picked' : '') + '" onclick="openOrder(' + o.id + ')">' + '<div class="queue-item-top">' + '<div class="queue-item-order">' + escHTML(o.order) + (picked ? ' <span style="font-size:10px;color:#15803D">· tap to reprint</span>' : '') + '</div>' + '<div class="status-dot ' + o.status + '"></div>' + '</div>' + '<div class="queue-item-style">' + escHTML(o.styleName) + '</div>' + '<div class="queue-item-details">' + escHTML(o.color) + ' · W' + escHTML(o.waist) + ' · ' + escHTML(o.inseam) + '&quot;</div>' + '</div>'; }).join(''); }

function setFilter(f, el) { currentFilter = f; document.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); }); el.classList.add('active'); renderQueue(); }

// ── OPEN ORDER ──
function openOrder(id) { var o = orders.find(function(x) { return x.id === id; }); if (!o) return; if (o.status === 'picked') { openReprint(id); return; } currentId = id; reprintMode = false; document.getElementById('pick-order-num').textContent = 'ORDER ' + o.order; document.getElementById('pick-style-name').textContent = o.styleName; document.getElementById('pick-style-num').textContent = o.styleNum; document.getElementById('pick-color').textContent = o.color; document.getElementById('pick-waist').textContent = o.waist; document.getElementById('pick-inseam').textContent = o.inseam + '"'; document.getElementById('pick-location').textContent = o.styleName + ' / ' + o.color + ' / W' + o.waist; var picked = orders.filter(function(x) { return x.status === 'picked'; }).length; document.getElementById('ps-picked').textContent = picked; document.getElementById('ps-total').textContent = orders.length; var si = document.getElementById('scan-input'); si.value = ''; si.className = 'scan-input'; document.getElementById('scan-error').textContent = ''; var ps = document.getElementById('screen-pick').querySelector('.pick-scroll'); if (ps) ps.scrollTop = 0; showScreen('screen-pick'); setTimeout(function() { si.focus(); }, 200);
}

function openReprint(id) { var o = orders.find(function(x) { return x.id === id; }); if (!o) return; currentId = id; reprintMode = true; fillConfirm(o); document.getElementById('btn-print-main').textContent = '🖨 Reprint Tag'; document.getElementById('btn-confirm-back').textContent = '← Back to Queue'; document.getElementById('btn-confirm-back').onclick = function() { goBackToQueue(); }; document.getElementById('btn-nopr').style.display = 'none'; showScreen('screen-confirm'); }

// ── SCAN ──
// normalize incoming scanner input; strip control chars and common suffixes
function normalizeScannedValue(v) {
  if (!v) return '';
  // remove non-printable chars
  v = v.replace(/[\x00-\x1F\x7F]/g, '');
  // trim whitespace
  v = v.trim();
  // remove common scanner suffix characters like \r or \n that slipped through
  v = v.replace(/\r|\n|\\t/g, '');
  // remove invisible unicode markers
  v = v.replace(/\uFEFF/g, '');
  return v;
}

var scanInput = document.getElementById('scan-input');
if (scanInput) {
  scanInput.addEventListener('paste', function(e) { setTimeout(function(){ var v = normalizeScannedValue(scanInput.value); scanInput.value = v; addLog('INFO','Pasted scan: ' + v); }, 60); });
  scanInput.addEventListener('input', function(e) { var v = normalizeScannedValue(scanInput.value); if (v !== scanInput.value) scanInput.value = v; });
}

function handleScanKey(e) { if (e.key === 'Enter') { e.preventDefault(); validateScan(); } }
function validateScan() {
  var o = orders.find(function(x) { return x.id === currentId; }); if (!o) return;
  var val = normalizeScannedValue(document.getElementById('scan-input').value);
  if (!val) return;
  addLog('INFO','Scanned value: ' + val + ' for order ' + (o ? o.order : 'N/A'));
  if (o.barcode && o.barcode !== '') {
    // compare normalized digits-only where appropriate
    var expected = String(o.barcode).replace(/\D/g,'');
    var got = String(val).replace(/\D/g,'');
    if (expected && expected !== '' && expected === got) { openConfirm(); }
    else if (o.barcode === val || String(o.barcode).toLowerCase() === String(val).toLowerCase()) { openConfirm(); }
    else { var el = document.getElementById('scan-input'); el.className = 'scan-input error'; document.getElementById('scan-error').textContent = 'Barcode mismatch — try again'; setTimeout(function() { el.className = 'scan-input'; el.value = ''; }, 1400); addLog('WARN','Barcode mismatch. expected=' + o.barcode + ' got=' + val); }
  } else { openConfirm(); }
}

// ── CONFIRM ──
function fillConfirm(o) { document.getElementById('lbl-order').textContent = o.order; document.getElementById('lbl-waist').textContent = o.waist + '"'; document.getElementById('lbl-inseam').textContent = o.inseam + '"'; document.getElementById('lbl-style').textContent = o.styleName; document.getElementById('lbl-meta').textContent = 'Color : ' + o.color; document.getElementById('lbl-customer').textContent = o.customer || '—'; document.getElementById('lbl-date').textContent = 'Order Date : ' + (o.orderDate || '—') + '  ·  SKU: ' + o.styleNum; document.getElementById('lbl-qty').textContent = 'Pant Qty : ' + (o.pantQty || '1') + '   ·   Total Qty : ' + (o.totalQty || '1'); document.getElementById('lbl-barcode').textContent = '||| ' + String(o.order||'').replace(/\D/g,'') + ' |||'; }
function openConfirm() { var o = orders.find(function(x) { return x.id === currentId; }); if (!o) return; reprintMode = false; fillConfirm(o); document.getElementById('btn-print-main').textContent = '🖨 Print & Mark Picked'; document.getElementById('btn-confirm-back').textContent = '← Back to Pick'; document.getElementById('btn-confirm-back').onclick = function() { showScreen('screen-pick'); }; document.getElementById('btn-nopr').style.display = ''; showScreen('screen-confirm'); }

// ── PRINT + MARK PICKED ──
var ZQ_SERVICE   = '38eb4a80-c570-11e3-9507-0002a5d5c51b';
var ZQ_WRITE     = '38eb4a82-c570-11e3-9507-0002a5d5c51b';
var ZEBRA_ADV    = 0xFE79;
var _btDevice = null; var _btChar = null;

function connectPrinter() {
  if (!navigator.bluetooth) { toast('Bluetooth not available in this browser'); addLog('ERROR','Web Bluetooth not available on this browser'); return; }
  addLog('INFO','Requesting Bluetooth device...');
  navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [ZQ_SERVICE] })
  .then(function(device) {
    _btDevice = device; _btDevice.addEventListener('gattserverdisconnected', onBtDisconnected); addLog('INFO','Selected device: ' + device.name); document.getElementById('diag-printer-name').textContent = device.name || '—'; setDiagState('Connecting');
    return device.gatt.connect();
  })
  .then(function(server) { return server.getPrimaryService(ZQ_SERVICE); })
  .then(function(service) { return service.getCharacteristic(ZQ_WRITE); })
  .then(function(char) { _btChar = char; setPrinterConnected(true); addLog('INFO','Printer connected'); setDiagState('Connected: ' + (_btDevice && _btDevice.name ? _btDevice.name : 'unknown')); })
  .catch(function(err) { if (err.name !== 'NotFoundError') { toast('Connect failed: ' + err.message); addLog('ERROR','Connect failed: ' + err.message); } setDiagState('Disconnected'); });
}

function reconnectPrinter() {
  if (!_btDevice) return Promise.reject(new Error('No previous device'));
  addLog('INFO','Attempting reconnect to ' + (_btDevice.name || 'device'));
  return _btDevice.gatt.connect()
    .then(function(server) { return server.getPrimaryService(ZQ_SERVICE); })
    .then(function(service) { return service.getCharacteristic(ZQ_WRITE); })
    .then(function(char) { _btChar = char; setPrinterConnected(true); addLog('INFO','Reconnected'); return char; });
}

function onBtDisconnected() { _btChar = null; setPrinterConnected(false); setDiagState('Disconnected'); addLog('WARN','Bluetooth disconnected'); toast('Printer disconnected'); }

function setPrinterConnected(on) { ['btn-connect-printer', 'btn-connect-printer2', 'btn-connect-upload'].forEach(function(id) { var b = document.getElementById(id); if (!b) return; var style = on ? 'background:rgba(0,180,0,.35);border-color:rgba(0,220,0,.5)' : 'background:rgba(255,100,0,.35);border-color:rgba(255,150,0,.5)'; if (id === 'btn-connect-upload') { b.textContent = on ? '🖨 Printer Connected' : '🖨 Connect Printer'; } else { b.style.cssText += ';' + style; b.textContent = on ? '🖨 Connected' : '🖨 Connect'; } }); }

function sendToPrinter(o, onDone) { var zpl = buildZPL(o); writeZPL(zpl, onDone, true); }

function writeZPL(zpl, onDone, allowRetry) {
  if (!_btChar) { toast('Printer not connected — tap 🖨 Connect first'); addLog('ERROR','writeZPL called with no _btChar'); return; }
  setDiagState('Sending');
  addLog('INFO','Preparing to send ZPL — bytes: ' + (new TextEncoder().encode(zpl)).length);
  var enc = new TextEncoder(); var data = enc.encode(zpl);
  var CHUNK = window.PRINTER_CHUNK_SIZE || 180;
  var DELAY = window.PRINTER_CHUNK_DELAY || 60;
  var attempts = 0;
  function doSendAttempt(tryIndex) {
    attempts = tryIndex;
    addLog('INFO','Write attempt #' + tryIndex + ', total bytes=' + data.length + ', chunk=' + CHUNK);
    var i = 0;
    function sendChunk() {
      if (i >= data.length) {
        addLog('INFO','All chunks queued');
        if (onDone) onDone(); setDiagState('OK'); return;
      }
      var slice = data.slice(i, i + CHUNK);
      _btChar.writeValueWithoutResponse(slice)
        .then(function() { i += CHUNK; setTimeout(sendChunk, DELAY); })
        .catch(function(err) {
          addLog('ERROR','Chunk write failed at offset ' + i + ': ' + err.message);
          _btChar = null; setPrinterConnected(false); setDiagState('Disconnected');
          if (allowRetry && _btDevice && tryIndex < window.PRINTER_MAX_RETRIES) {
            addLog('INFO','Connection dropped — retrying (attempt ' + (tryIndex+1) + ')');
            reconnectPrinter().then(function() { writeZPL(zpl, onDone, false); }).catch(function(e) { addLog('ERROR','Reconnect failed: ' + e.message); toast('Print failed: ' + e.message + ' — reconnect and try again'); setDiagState('Failed'); });
          } else { toast('Print failed: ' + err.message + ' — reconnect and try again'); setDiagState('Failed'); }
        });
    }
    sendChunk();
  }
  doSendAttempt(1);
}

function printTestLabel() { if (!_btChar) { toast('Connect the printer first'); addLog('WARN','Test label requested but no printer connected'); return; } sendToPrinter({ order: '#000000', styleName: 'Test Label — Do Not Ship', styleNum: 'TEST0000', color: 'Test', waist: '34', inseam: '32', customer: 'FIRSTNAME LASTNAME', orderDate: new Date().toLocaleDateString('en-US'), pantQty: '1', totalQty: '1' }, function() { toast('✓ Test label sent'); addLog('INFO','Test label sent'); }); }

function toggleSimpleLabel() { window.SIMPLE_LABEL_MODE = !window.SIMPLE_LABEL_MODE; addLog('INFO','Simple label mode = ' + window.SIMPLE_LABEL_MODE); setDiagState(window.SIMPLE_LABEL_MODE ? 'SimpleLabel' : 'Normal'); }

// ── ZPL builder — keep same layout but conditionally omit large GFA if simple mode
function buildZPL(o) {
  var orderTxt  = escZPL(o.order);
  var orderNum  = String(o.order || '').replace(/\D/g, '') || '0';
  var dateStr   = 'Order Date : ' + escZPL(o.orderDate);
  var waistStr  = escZPL(o.waist) + '"';
  var hemStr    = escZPL(o.inseam) + '"';
  var colorStr  = 'Color : ' + escZPL(o.color);
  var skuStr    = 'SKU: ' + escZPL(o.styleNum);
  var custName  = escZPL(o.customer);
  var styleName = escZPL(o.styleName);
  var pantQtyStr  = 'Pant Quantity : ' + escZPL(o.pantQty || '1');
  var totalQtyStr = 'Total Quantity : ' + escZPL(o.totalQty || '1');
  var z = '~TA000~JSN^LT0^MNW^MTD^PON^PMN^LH0,0^JMA^PR5,5~SD10^JUS^LRN^CI27^PA0,1,1,0';
  z += '^XA^MMT^PW812^LL406^LS0';
  if (!window.SIMPLE_LABEL_MODE) {
    // include logo GFA (original) — may be large
    z += '^FO14,133^GFA,797,1632,12,:Z64:eJyVVcGO0zAQHTe7SgVScuRGe+cjsh9B7/6E/kEsDhCJar+hxyorde8c2CLxD5yq9THisJRTIzbYzIzt2KyIAEurfXp6Gr95mXFrOx5TT+CuGc/1GsZTyASnvJ7gf9dfrlar14w7uKN7NDTIC77zJAZZyIxx...';
  }
  z += '^FT175,257^A0B,28,28^FH\\^CI28^FD' + orderTxt + '^FS^CI27';
  z += '^FO185,5^GB0,395,3^FS';
  z += '^FT255,345^A0B,86,86^FH\\^CI28^FD' + waistStr + '^FS^CI27';
  z += '^FT255,140^A0B,86,86^FH\\^CI28^FD' + hemStr + '^FS^CI27';
  z += '^FT280,370^A0B,22,22^FH\\^CI28^FDWaist^FS^CI27';
  z += '^FT280,115^A0B,22,22^FH\\^CI28^FDInseam^FS^CI27';
  z += '^FO315,5^GB0,395,3^FS';
  z += '^FT358,388^A0B,38,30^FH\\^CI28^FD' + styleName + '^FS^CI27';
  z += '^FT390,388^A0B,26,26^FH\\^CI28^FD' + colorStr + '^FS^CI27';
  z += '^FO404,5^GB0,395,3^FS';
  z += '^FT426,388^A0B,22,22^FH\\^CI28^FDCustom Hemmed For:^FS^CI27';
  z += '^FT458,388^A0B,28,28^FH\\^CI28^FD' + custName + '^FS^CI27';
  z += '^FO471,5^GB0,395,3^FS';
  z += '^FT494,388^A0B,22,22^FH\\^CI28^FD' + dateStr + '^FS^CI27';
  z += '^FT520,388^A0B,22,22^FH\\^CI28^FD' + skuStr + '^FS^CI27';
  z += '^FO534,5^GB0,395,3^FS';
  z += '^FT558,388^A0B,20,20^FH\\^CI28^FD' + pantQtyStr + '^FS^CI27';
  z += '^FT558,190^A0B,20,20^FH\\^CI28^FD' + totalQtyStr + '^FS^CI27';
  z += '^FO572,5^GB0,395,3^FS';
  z += '^BY2,3,80^FT690,293^BCB,,Y,N';
  z += '^FH\\^FD>;' + orderNum + '^FS';
  z += '^FO745,0^GB0,400,3^FS';
  z += '^PQ1,0,1,Y^XZ';
  return z;
}

// ── MARK PICKED / FLOW unchanged but with added logging
function executePrint() {
  var o = orders.find(function(x) { return x.id === currentId; }); if (!o) return; if (!_btChar) { toast('Printer not connected — tap 🖨 Connect first'); addLog('ERROR','Attempted executePrint with no printer'); return; }
  setDiagState('Printing');
  sendToPrinter(o, function onSent() {
    if (reprintMode) { toast('✓ Reprinted: ' + o.order); addLog('INFO','Reprinted ' + o.order); goBackToQueue(); return; }
    o.status = 'picked'; o.lastPrint = { ts: Date.now(), attempts: 1 }; storeSave(); updateProgress(); updateTopbar(); toast('✓ Picked: ' + o.order); addLog('INFO','Picked and printed: ' + o.order);
    var next = orders.find(function(x) { return x.status === 'pending'; }); if (next) { openOrder(next.id); } else { showDoneScreen(); }
  });
}

function markPickedNoPrint() { var o = orders.find(function(x) { return x.id === currentId; }); if (!o) return; if (!confirm('Mark ' + o.order + ' as picked WITHOUT printing a tag?')) return; o.status = 'picked'; storeSave(); updateProgress(); updateTopbar(); toast('Picked (no tag): ' + o.order); addLog('INFO','Picked without print: ' + o.order); var next = orders.find(function(x) { return x.status === 'pending'; }); if (next) { openOrder(next.id); } else { showDoneScreen(); } }

// ── SKIP / DONE / PROGRESS / UI helpers unchanged
function skipOrder() { var o = orders.find(function(x) { return x.id === currentId; }); if (!o) return; orders = orders.filter(function(x) { return x.id !== o.id; }).concat([o]); storeSave(); toast('Skipped — moved to end'); addLog('INFO','Skipped order ' + o.order); var next = orders.find(function(x) { return x.status === 'pending' && x.id !== o.id; }); if (next) { openOrder(next.id); } else { goBackToQueue(); } }
function showDoneScreen() { var picked = orders.filter(function(o) { return o.status === 'picked'; }).length; var skipped = orders.filter(function(o) { return o.status === 'pending'; }).length; var elapsed = sessionStart ? Math.floor((Date.now() - sessionStart) / 60000) : 0; document.getElementById('done-picked').textContent = picked; document.getElementById('done-skipped').textContent = skipped; document.getElementById('done-time').textContent = elapsed + 'm'; if (skipped === 0) storeClear(); showScreen('screen-done'); addLog('INFO','Session complete. picked=' + picked + ' skipped=' + skipped); }
function updateProgress() { var total = orders.length; var picked = orders.filter(function(o) { return o.status === 'picked'; }).length; document.getElementById('progress-fill').style.width = (total ? (picked / total) * 100 : 0) + '%'; document.getElementById('pl-picked').textContent = picked; document.getElementById('pl-total').textContent = total; }
function updateTopbar() { var picked = orders.filter(function(o) { return o.status === 'picked'; }).length; document.getElementById('stat-picked').textContent = picked; document.getElementById('stat-total').textContent = orders.length; var e = sessionStart ? Math.floor((Date.now() - sessionStart) / 60000) : 0; document.getElementById('stat-elapsed').textContent = e + 'm'; document.getElementById('topbar-stats').style.display = 'block'; }
function showScreen(id) { document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); }); document.getElementById(id).classList.add('active'); }
function confirmNewSession() { if (!confirm('Start a new session? Current progress will be cleared.')) return; orders = []; rawRows = []; csvHeaders = []; currentId = null; sessionStart = null; currentFilter = 'all'; reprintMode = false; storeClear(); document.getElementById('upload-preview').classList.remove('visible'); document.getElementById('col-map').style.display = 'none'; document.getElementById('btn-start').disabled = true; document.getElementById('csv-file-input').value = ''; document.getElementById('search-input').value = ''; document.querySelectorAll('.filter-tab').forEach(function(t, i) { t.classList.toggle('active', i === 0); }); showScreen('screen-upload'); addLog('INFO','New session started by user'); }

function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(function() { t.classList.remove('show'); }, 2400); }

setInterval(function() { if (sessionStart && document.getElementById('screen-queue').classList.contains('active')) updateTopbar(); }, 30000);

// BOOT
document.getElementById('ver-stamp').textContent = 'Pick System ' + APP_VERSION;
document.querySelectorAll('.topbar-logo').forEach(function(el){ el.innerHTML += ' <em style="font-size:9px">' + APP_VERSION + '</em>'; });
tryRestoreSession(); addLog('INFO','App booted');
</script>
